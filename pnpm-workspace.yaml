packages:
  - .

overrides:
  '@babel/core': '>=7.29.6'
  '@hono/node-server': '>=1.19.13'
  picomatch: '>=4.0.4'
  postcss: '>=8.5.10'
  undici: '>=6.27.0'
  uuid: '>=11.1.1'

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@prisma/engines'
  - '@swc/core'
  - esbuild
  - prisma

allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
